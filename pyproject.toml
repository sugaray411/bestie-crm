[project]
name = "btcpred"
version = "0.1.0"
description = "Next-15m BTC candle prediction with leakage-resistant walk-forward evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "requests>=2.28",
    "joblib>=1.3",
]

[project.optional-dependencies]
fast = ["lightgbm>=4.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["btcpred*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end walk-forward runs (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
